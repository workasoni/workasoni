<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="Akash Soni, youth worker in Calgary">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7C873"/><stop offset="1" stop-color="#EE7B5C"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="38"/></filter>
    <clipPath id="clip"><rect width="1200" height="400" rx="28"/></clipPath>
  </defs>
  <style>
    .orb1 { animation: d1 16s ease-in-out infinite alternate; }
    .orb2 { animation: d2 19s ease-in-out infinite alternate; }
    .orb3 { animation: d3 13s ease-in-out infinite alternate; }
    @keyframes d1 { from { transform: translate(0,0); } to { transform: translate(160px,40px); } }
    @keyframes d2 { from { transform: translate(0,0); } to { transform: translate(-200px,-30px); } }
    @keyframes d3 { from { transform: translate(0,0); } to { transform: translate(-90px,60px); } }
    .t1 { animation: up 1.1s ease-out both; }
    .t2 { animation: up 1.1s ease-out .25s both; }
    .t3 { animation: up 1.1s ease-out .5s both; }
    @keyframes up { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }
  </style>
  <g clip-path="url(#clip)">
    <rect width="1200" height="400" fill="url(#bg)"/>
    <g filter="url(#soft)">
      <circle class="orb1" cx="260" cy="110" r="150" fill="#FFF1DC" opacity=".85"/>
      <circle class="orb2" cx="980" cy="310" r="190" fill="#3E9C9B" opacity=".55"/>
      <circle class="orb3" cx="900" cy="70" r="110" fill="#0F2A43" opacity=".22"/>
    </g>
    <g fill="#0F2A43" opacity=".16">
      <rect x="40" y="356" width="46" height="44"/><rect x="96" y="340" width="56" height="60"/><rect x="162" y="350" width="40" height="50"/>
      <rect x="212" y="330" width="52" height="70"/><rect x="274" y="352" width="64" height="48"/><rect x="348" y="342" width="44" height="58"/>
    </g>
    <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" fill="#0F2A43">
      <text class="t1" x="80" y="170" font-size="74" font-weight="700" letter-spacing="-1.5">Akash Soni</text>
      <text class="t2" x="82" y="222" font-size="28" font-weight="600">Youth Worker · Calgary, Canada</text>
      <text class="t3" x="82" y="278" font-size="21">Helping newcomer youth find belonging.</text>
      <text class="t3" x="82" y="308" font-size="21">Building small things with React, motion and 3D.</text>
    </g>
  </g>
</svg>
